name: Refresh Codex reset status

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-status
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh and publish status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_status.py
            git add public/status.json

            if git diff --cached --quiet; then
              echo "No status change to commit."
              exit 0
            fi

            git commit -m "Refresh Codex reset status"

            if git push origin HEAD:main; then
              echo "Status published successfully."
              exit 0
            fi

            echo "Remote changed before push; retrying from latest main."
            sleep $((attempt * 2))
          done

          echo "Could not publish status after 5 attempts."
          exit 1
