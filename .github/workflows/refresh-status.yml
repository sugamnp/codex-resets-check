name: Refresh Codex reset status

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_status.py"
      - "scripts/run_status.py"
      - ".github/workflows/refresh-status.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-status
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh and publish status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            python scripts/run_status.py
            git add public/status.json

            if git diff --cached --quiet; then
              echo "No status change to commit."
              break
            fi

            git commit -m "Refresh Codex reset status"

            if git push origin HEAD:main; then
              echo "Status published successfully."
              break
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Could not publish status after 5 attempts."
              exit 1
            fi

            echo "Remote changed before push; retrying from latest main."
            sleep $((attempt * 2))
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
